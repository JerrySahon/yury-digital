const projectData=[{image:'assets/emozu-friends.webp',alt:'Emozu wearable concept renders',name:'Emozu',tag:'01 · current focus · research',desc:'Exploring early warning at home for autistic children and their families.',cta:'Explore the research',href:'https://emozu.kids/'},{image:'assets/pearch.jpg',alt:'Pearch product website',name:'Pearch.AI',tag:'02 · co-founder · people tech',desc:'AI people search, a research paper and customers in 15 countries.',cta:'Explore Pearch',href:'https://pearch.ai/'},{image:'assets/padel.webp',alt:'Padel Battle club website',name:'Padel Club OS',tag:'03 · founder · built for a club',desc:'A club operating system built around guests, events and bookings.',cta:'See the case',href:'../padel_club_OS/'}];
const summary='Founder and product builder. Building Emozu now: research for families. Previously co-founded Pearch.AI and built products for real-world businesses.';
function blocks(){return projectData.map((p,i)=>`<article class="project"><img class="project-thumb" src="${p.image}" alt="${p.alt}" loading="lazy"><span class="tag">${p.tag}</span><h3>${p.name}</h3><p>${p.desc}</p><span class="go"><a class="project-link" href="${p.href}">${p.cta} ↗</a></span><button type="button" class="contact-project" data-contact="${i}">Discuss ${p.name} →</button></article>`).join('')}
function render(n){const stage=document.getElementById('stage');const num=n+1;document.querySelectorAll('.choices button').forEach((b,i)=>b.setAttribute('aria-pressed',String(i===n)));stage.className='stage v'+num;let title=n===3?'Hi, I’m Yury.<br><em>Building with care.</em>':headline[n];stage.innerHTML=`<nav class="site-nav"><span class="brand">Yury.digital</span><span class="nav-mid">FOUNDER / PRODUCT / YEREVAN</span><a class="nav-end" href="https://www.linkedin.com/in/yu-ry" target="_blank" rel="noopener">LinkedIn ↗</a></nav><section class="hero"><div class="hero-copy"><div class="mobile-identity"><div class="mobile-portrait">YS</div><img src="assets/emozu-logo.webp" alt="Emozu"></div><p class="eyebrow"><i></i> YURY SAKHONCHYK · FOUNDER & PRODUCT BUILDER</p><span class="identity">Yury Sakhonchyk</span><h1>${title}</h1><p class="intro">${summary}</p><div class="actions"><a class="action" href="https://emozu.kids/">Explore Emozu <span>↗</span></a><a class="textlink" href="#experience">See my work ↓</a></div>${proof}<div class="project-now"><b>NOW / EMOZU</b><span>My current focus: a research project for families · pre-seed</span></div></div><div class="visual">${portrait}${art}</div></section><section class="experience" id="experience"><div class="section-top"><div><p class="eyebrow">THE WORK · WHAT I’M BUILDING</p><h2>${n===2?'Selected experience':n===7?'Experience & focus':'What I’m building'}</h2></div><p>From raising and research to products in the real world. Choose a project to go deeper.</p></div><div class="projects">${blocks()}</div></section><footer class="endnote"><span>YURY.DIGITAL / ${directions[n][1].toUpperCase()}</span><span>EMOZU IS AT RESEARCH STAGE</span></footer>`;if(portraitURL){const p=stage.querySelector('.portrait');p.classList.add('has-photo');p.insertAdjacentHTML('afterbegin',`<img src="${portraitURL}" alt="Your selected portrait">`);stage.querySelector('.mobile-portrait').insertAdjacentHTML('afterbegin',`<img src="${portraitURL}" alt="Your selected portrait">`)}history.replaceState(null,'','#'+num);window.scrollTo({top:0,behavior:'instant'})}
const prompts=[['Talk about Emozu','For investors, research partners and families. Please do not include a child’s medical information.'],['Talk about Pearch.AI','Tell me about your people-search or partnership question.'],['Talk about Padel Club OS','Tell me about your venue and what you would like to improve.']];let contactIndex=0;document.getElementById('stage').addEventListener('click',e=>{const b=e.target.closest('[data-contact]');if(!b)return;contactIndex=+b.dataset.contact;document.getElementById('dialog-title').textContent=prompts[contactIndex][0];document.getElementById('dialog-help').textContent=prompts[contactIndex][1];document.getElementById('contact-message').value='';document.getElementById('contact-dialog').showModal()});document.getElementById('dialog-close').addEventListener('click',()=>document.getElementById('contact-dialog').close());document.getElementById('contact-form').addEventListener('submit',e=>{e.preventDefault();const field=document.getElementById('contact-message');if(!field.reportValidity())return;const msg='Hi Yury, I would like to discuss '+projectData[contactIndex].name+': '+field.value;window.open('https://t.me/jerry_sahon?text='+encodeURIComponent(msg),'_blank','noopener');document.getElementById('contact-dialog').close()});
let portraitURL='';document.querySelector('#choices').innerHTML=directions.map((x,i)=>`<button type="button" aria-pressed="${i===0}" aria-label="Direction ${x[0]}: ${x[1]}" data-n="${i}">${x[0]} <span>${x[1]}</span></button>`).join('');document.querySelector('#choices').addEventListener('click',e=>{let b=e.target.closest('button');if(b){render(+b.dataset.n);b.scrollIntoView({block:'nearest',inline:'nearest',behavior:'smooth'})}});document.querySelector('#portrait-input').addEventListener('change',e=>{let f=e.target.files[0];if(!f)return;if(portraitURL)URL.revokeObjectURL(portraitURL);portraitURL=URL.createObjectURL(f);render(Math.max(0,directions.findIndex((_,i)=>document.querySelectorAll('.choices button')[i].getAttribute('aria-pressed')==='true')))});let start=Number(location.hash.slice(1));render(start>=1&&start<=10?start-1:0);
</script></body></html>
